name: Release extension
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version) || process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error('Release tag must equal v + package.json version');
          }
          JS
      - run: npm ci
      - run: npm run validate
      - run: npm run evidence:check
      - name: Prepare checksums and installation patch
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release-assets.mjs
          cd dist
          sha256sum argo-rollouts-installer.tar.gz > checksums.txt
          tar -tzf argo-rollouts-installer.tar.gz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/argo-rollouts-installer.tar.gz \
            dist/checksums.txt \
            dist/argocd-server-patch.yaml \
            validation-report.json \
            docs/installation.md \
            --verify-tag --generate-notes --title "Argo CD Addon Catalog $RELEASE_TAG"
